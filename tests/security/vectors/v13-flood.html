<!doctype html>
<html><head><meta charset="utf-8"><script src="/_lib.js"></script></head><body>
<script>
  // 1 MB 訊息（schema 上合法的型別，但超過 64 KB）
  var big = 'x'.repeat(1024 * 1024);
  parent.postMessage({ v: 1, type: 'storageSnapshot', data: big }, '*');
  parent.postMessage({ v: 1, type: 'dialog', kind: 'alert', text: big }, '*');
  // 約每秒 10,000 則，持續 3 秒
  var sent = 0;
  var start = performance.now();
  var id = setInterval(function () {
    for (var i = 0; i < 1000; i++) {
      parent.postMessage({ v: 1, type: 'hover', rect: { x: i, y: 0, w: 1, h: 1 }, label: 'flood' }, '*');
      sent++;
    }
    if (performance.now() - start > 3000) {
      clearInterval(id);
      report('result', { sent: sent });
      report('done');
    }
  }, 100);
</script>
</body></html>
