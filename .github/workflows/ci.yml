name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: hpe, POSTGRES_PASSWORD: hpe, POSTGRES_DB: hpe_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hpe" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://hpe:hpe@localhost:5432/hpe_test
      TEST_DATABASE_URL: postgres://hpe:hpe@localhost:5432/hpe_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:security
      - run: pnpm test:export
      - name: e2e
        env:
          E2E_DATABASE_URL: postgres://hpe:hpe@localhost:5432/hpe_e2e
        run: |
          psql postgres://hpe:hpe@localhost:5432/hpe_test -c "CREATE DATABASE hpe_e2e"
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
